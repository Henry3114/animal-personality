<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FDF7F0">
<title>动物原型人格测试 · 五只动物里藏着你</title>
<meta name="description" content="六道题，一片走不出去的沙漠。五只动物里，藏着一个你。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23D9784A'/%3E%3Cg fill='%23fff'%3E%3Cellipse cx='16' cy='20' rx='7' ry='5.8'/%3E%3Cellipse cx='7.4' cy='12.6' rx='2.9' ry='3.5'/%3E%3Cellipse cx='12.8' cy='7.8' rx='2.9' ry='3.7'/%3E%3Cellipse cx='19.2' cy='7.8' rx='2.9' ry='3.7'/%3E%3Cellipse cx='24.6' cy='12.6' rx='2.9' ry='3.5'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page cover">
  <div class="paw">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <g fill="#fff">
        <ellipse cx="20" cy="26" rx="8.6" ry="7.1"/>
        <ellipse cx="9" cy="16.6" rx="3.4" ry="4.2" transform="rotate(-18 9 16.6)"/>
        <ellipse cx="15.9" cy="10.4" rx="3.4" ry="4.4"/>
        <ellipse cx="24.1" cy="10.4" rx="3.4" ry="4.4"/>
        <ellipse cx="31" cy="16.6" rx="3.4" ry="4.2" transform="rotate(18 31 16.6)"/>
      </g>
    </svg>
  </div>

  <div class="brand-en">Animal Personality</div>
  <h1 class="brand-cn">动物原型人格测试</h1>
  <p class="brand-sub">你和五只动物，走一遍沙漠</p>

  <div class="cover-animals" id="coverAnimals"></div>

  <section class="card intro">
    <h2 class="card-h"><span class="spark">✨</span>这是一个什么测试</h2>
    <div class="card-hr"></div>
    <ul class="intro-list">
      <li>六道题，一片走不出去的沙漠。你和五只动物一起走，<b>每一轮都要放弃一只</b>。</li>
      <li>题目里永远只有这五只：狮、马、牛、羊、猴。放弃过的不会再出现，也不会重来。</li>
      <li>最后给你一个原型：<b>主导的那只 ＋ 底色那只</b>，共 20 种。</li>
    </ul>
    <div class="meta">
      <span>20 种原型</span><span>6 道题</span><span>专属结果图</span>
    </div>
  </section>

  <div class="start-wrap">
    <button class="btn btn-primary" id="startBtn">开始测试</button>
    <p class="start-note">1 分钟 · 没有标准答案 · 测完可保存结果图</p>
  </div>
</main>

<!-- 卡密门禁 -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="gate-mark">🐾</div>
    <div class="gate-title">输入卡密</div>
    <p class="gate-desc">测试为付费内容<br>请输入购买时收到的卡密</p>
    <input class="gate-input" id="gateInput" type="text" inputmode="latin"
           placeholder="卡密" maxlength="24" autocomplete="off" spellcheck="false">
    <button class="btn btn-primary gate-btn" id="gateBtn">进入</button>
    <div class="gate-err" id="gateErr">卡密不对，请再试一次</div>
  </div>
</div>

<script src="assets/animals/cute-images.js"></script>
<script src="data.js"></script>
<script>
(function () {
  'use strict';

  /* ===== 配置 ===== */
  var GATE_ON  = true;          // 想完全免费开放，把它改成 false
  var PASSCODE = 'ap2026';      // 卡密（大小写不敏感）
  var KEY_GATE = 'ap_gate';
  var KEY_ANSW = 'ap_answers';

  /* ===== 渲染封面五只动物 ===== */
  var box = document.getElementById('coverAnimals');
  ANIMALS.forEach(function (a) {
    var d = document.createElement('div');
    d.className = 'cover-animal';
    d.innerHTML = '<div class="av"><img src="' + ANIMAL_SRC(a.id) + '" alt=""></div>' +
                  '<span>' + a.name + '</span>';
    box.appendChild(d);
  });

  /* ===== 按钮状态 ===== */
  var startBtn = document.getElementById('startBtn');
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY_ANSW) || 'null'); } catch (e) {}
  if (saved && saved[1]) {
    startBtn.textContent = '查看我的结果';
    startBtn.addEventListener('click', function () {
      location.href = 'result.html';
    });
    var again = document.createElement('button');
    again.className = 'btn btn-ghost';
    again.style.marginTop = '10px';
    again.textContent = '重新测一次';
    again.addEventListener('click', function () {
      localStorage.removeItem(KEY_ANSW);
      location.href = 'test.html';
    });
    startBtn.parentNode.appendChild(again);
  } else {
    startBtn.addEventListener('click', function () {
      location.href = 'test.html';
    });
  }

  /* ===== 卡密门禁 ===== */
  var gate = document.getElementById('gate');
  var input = document.getElementById('gateInput');
  var btn = document.getElementById('gateBtn');
  var err = document.getElementById('gateErr');

  function unlocked() {
    try { return sessionStorage.getItem(KEY_GATE) === '1'; } catch (e) { return false; }
  }

  if (!GATE_ON || unlocked()) {
    gate.classList.add('hide');
  } else {
    setTimeout(function () { input.focus(); }, 260);
  }

  function verify() {
    var v = (input.value || '').trim().toLowerCase();
    if (!v) { input.focus(); return; }
    if (v === PASSCODE.toLowerCase()) {
      try { sessionStorage.setItem(KEY_GATE, '1'); } catch (e) {}
      gate.classList.add('hide');
    } else {
      err.classList.add('show');
      input.value = '';
      input.focus();
      setTimeout(function () { err.classList.remove('show'); }, 2200);
    }
  }

  btn.addEventListener('click', verify);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') verify(); });
})();
</script>
</body>
</html>
